# keybind-visualizer options
# Source: https://github.com/v-amorim/mpv

# Physical keyboard layout to draw. mpv cannot auto-detect the OS keyboard
# layout, so pick the one matching your keyboard. The value must be a key in
# the "layouts" object of the JSON data file below.
# Built-in: ansi | iso | abnt2 | jis
layout=abnt2

# JSON file holding the layout definitions. Path is relative to the mpv config
# dir (e.g. portable_config). Edit it to tweak key positions or add layouts.
layouts_file=script-opts/keybind-visualizer-layouts.json

# Whether to show mpv's built-in default bindings (the ones baked into mpv
# itself, as opposed to what you set in input.conf).
#   auto (default) - ask mpv whether they're actually enabled right now and
#                     hide them only if they're confirmed off
#   no             - always hide them
#   yes            - always show them, even if disabled
show_default_bindings=auto

# Pause playback while the overlay is open (and unpause on close, but only
# if this script is the one that paused it).
pause_on_open=yes
